# FileBrowser Quantum v2.0.0+ configuration (servapp)
# http: port is the container's internal listen port (route maps :80).
http:
  port: 80
server:
  sources:
    - path: "/volumes"
      config:
        defaultEnabled: true
        defaultPermissions:
          view: true
          modify: true
          create: true
          delete: true
          download: true
      name: "ServApp Volumes"
    - path: "/host"
      config:
        defaultEnabled: true
        defaultPermissions:
          view: true
          modify: true
          create: true
          delete: true
          download: true
      name: "Host"
  database:
    path: "data/database.sqlite"
    migrateFrom: "data/database.db"
auth:
  methods:
    noauth: true  # access controlled by Cosmos SmartShield
frontend:
  name: "Filebrowser Quantum"
userDefaults:
  preview:
    highQuality: true
    image: true
    video: true
    motionVideoPreview: true
    office: true
    popup: true
    folder: true
  account:
    permissions:
      api: false
      admin: false
      share: false
      realtime: false